{{define "trade_item"}}
<div class="bg-white rounded-lg shadow-md p-4 mb-4 flex justify-between items-center trade-item" data-id="{{.id}}">
    <div class="flex-1">
        <div class="flex items-center">
            <h3 class="text-lg font-semibold">{{.symbol}} {{.type}} ${{.strike}}</h3>
            <span class="ml-2 px-2 py-1 text-xs rounded-full 
                {{if eq .status "PENDING"}}bg-yellow-100 text-yellow-800{{end}}
                {{if eq .status "PLACED"}}bg-blue-100 text-blue-800{{end}}
                {{if eq .status "EXECUTED"}}bg-green-100 text-green-800{{end}}
                {{if eq .status "FAILED"}}bg-red-100 text-red-800{{end}}">
                {{.status}}
            </span>
        </div>
        <p class="text-gray-600">{{.description}}</p>
        <p class="text-sm text-gray-500">Expiration: {{.expiration}}</p>
    </div>
    <div class="space-x-2">
        {{if eq .status "PENDING"}}
        <button class="place-trade-btn bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded"
                data-id="{{.id}}" data-text="{{.raw_text}}">
            Place Trade
        </button>
        {{end}}
        {{if eq .status "PLACED"}}
        <button class="execute-trade-btn bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded"
                data-id="{{.id}}">
            Mark Executed
        </button>
        {{end}}
        <button class="delete-trade-btn text-red-500 hover:text-red-700"
                data-id="{{.id}}">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
            </svg>
        </button>
    </div>
</div>
{{end}}
