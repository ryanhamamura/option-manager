{{define "content"}}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold">Trade Alerts Dashboard</h2>
        <div>
            <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm">
                {{.activeCount}} Active Trades
            </span>
        </div>
    </div>

    <!-- Trade status filter -->
    <div class="bg-white p-4 rounded-lg shadow-md">
        <div class="flex space-x-2">
            <a href="/dashboard" class="px-4 py-2 rounded {{if not .statusFilter}}bg-blue-500 text-white{{else}}bg-gray-200 text-gray-700 hover:bg-gray-300{{end}}">
                All
            </a>
            <a href="/dashboard?status=PENDING" class="px-4 py-2 rounded {{if eq .statusFilter "PENDING"}}bg-yellow-500 text-white{{else}}bg-gray-200 text-gray-700 hover:bg-gray-300{{end}}">
                Pending
            </a>
            <a href="/dashboard?status=PLACED" class="px-4 py-2 rounded {{if eq .statusFilter "PLACED"}}bg-blue-500 text-white{{else}}bg-gray-200 text-gray-700 hover:bg-gray-300{{end}}">
                Placed
            </a>
            <a href="/dashboard?status=EXECUTED" class="px-4 py-2 rounded {{if eq .statusFilter "EXECUTED"}}bg-green-500 text-white{{else}}bg-gray-200 text-gray-700 hover:bg-gray-300{{end}}">
                Executed
            </a>
            <a href="/dashboard?status=FAILED" class="px-4 py-2 rounded {{if eq .statusFilter "FAILED"}}bg-red-500 text-white{{else}}bg-gray-200 text-gray-700 hover:bg-gray-300{{end}}">
                Failed
            </a>
        </div>
    </div>

    <!-- Trade alerts list -->
    <div id="trades-container" class="space-y-4">
        {{if .trades}}
            {{range .trades}}
                {{template "trade_item" .}}
            {{end}}
        {{else}}
            <div class="bg-white rounded-lg shadow-md p-8 text-center">
                <p class="text-gray-500">No trades found. Waiting for alerts...</p>
            </div>
        {{end}}
    </div>
</div>

<!-- Toast notification -->
<div id="toast" class="fixed bottom-4 right-4 bg-green-500 text-white px-4 py-2 rounded shadow-lg transform transition-transform duration-300 translate-y-20">
    <span id="toast-message">Trade placed successfully!</span>
</div>
{{end}}
