{{define "content"}}
<div class="flex flex-col items-center justify-center min-h-[50vh]">
    <div class="bg-white p-8 rounded-lg shadow-md max-w-lg w-full text-center">
        <h2 class="text-3xl font-bold text-red-600 mb-4">Error {{.status}}</h2>
        <p class="text-gray-700 mb-6">{{.message}}</p>
        {{if .error}}
            <div class="bg-gray-100 p-4 rounded text-left mb-6 overflow-auto max-h-40">
                <pre class="text-xs text-gray-700">{{.error}}</pre>
            </div>
        {{end}}
        <a href="/" class="inline-block bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded">
            Return to Dashboard
        </a>
    </div>
</div>
{{end}}
